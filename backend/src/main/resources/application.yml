server:
  port: ${PORT:8081}

spring:
  application:
    name: cargoshare-backend
  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/cargosharedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

# Security & JWT Configuration
app:
  seed-demo: ${SEED_DEMO:true}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

logging:
  level:
    com.cargoshare: INFO
    org.springframework.security: WARN
